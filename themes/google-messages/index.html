<div id="gm-shell">
    <header class="gm-app-header">
        <button type="button" id="gm-menu" class="gm-icon" aria-label="Toggle navigation" aria-expanded="true">☰</button>
        <span class="gm-brand">Guinevere <span>Messages</span></span>
        <button type="button" id="gm-connection" class="gm-status" title="Connections">Connections</button>
        <button type="button" id="gm-profile-button" class="gm-icon gm-profile-button" aria-label="Personas" aria-expanded="false"><img id="gm-profile-image" alt="Current persona"></button>
    </header>
    <button type="button" id="gm-nav-backdrop" class="gm-backdrop" aria-label="Close navigation" hidden></button>
    <aside id="gm-sidebar" aria-label="Application navigation">
        <button type="button" class="gm-start" data-gm-panel="characters">＋ <span>Start chat</span></button>
        <nav>
            <button type="button" id="gm-home">⌂ <span>Home</span></button>
            <button type="button" data-gm-panel="characters">☷ <span>Contacts &amp; groups</span></button>
            <p class="gm-nav-label">Workspace</p>
            <button type="button" data-gm-panel="responseSettings">☷ <span>Generation</span></button>
            <button type="button" data-gm-panel="worldInfo">▤ <span>Lorebooks</span></button>
            <button type="button" data-gm-panel="extensions">＋ <span>Extensions</span></button>
            <button type="button" data-gm-panel="backgrounds">▧ <span>Backgrounds</span></button>
            <button type="button" data-gm-panel="userSettings">⚙ <span>Settings</span></button>
        </nav>
        <div class="gm-sidebar-bottom"><button type="button" id="gm-appearance-button">◐ <span>Appearance</span></button><a href="https://docs.sillytavern.app" target="_blank" rel="noopener noreferrer">Help &amp; documentation ↗</a></div>
    </aside>
    <header class="gm-chat-header">
        <button type="button" id="gm-back" class="gm-icon" aria-label="Back to navigation">←</button>
        <button type="button" id="gm-chat-details"><strong id="gm-chat-name">Welcome</strong><small id="gm-chat-status">Choose a conversation to get started</small></button>
        <button type="button" id="gm-chat-actions" class="gm-icon" aria-label="Conversation actions">⋮</button>
    </header>
    <section id="gm-profile" class="gm-popover" aria-label="Personas" hidden>
        <div class="gm-popover-heading"><strong id="gm-persona-name">Your persona</strong><button type="button" id="gm-profile-close" class="gm-icon" aria-label="Close personas">×</button></div>
        <div id="gm-persona-list"></div>
        <p id="gm-profile-error" role="status"></p>
        <button type="button" data-gm-panel="personas">Manage personas</button>
        <button type="button" id="gm-profile-appearance">Appearance</button>
        <button type="button" data-gm-panel="userSettings">SillyTavern settings</button>
    </section>
    <section id="gm-settings" class="gm-overlay" hidden>
        <div class="gm-settings-window" role="dialog" aria-modal="true" aria-labelledby="gm-settings-title">
            <div class="gm-settings-heading"><h2 id="gm-settings-title">Settings</h2><button type="button" id="gm-settings-close" class="gm-icon" aria-label="Close settings">×</button></div>
            <div class="gm-settings-layout"><nav id="gm-settings-tabs" aria-label="Settings categories"></nav><div id="gm-settings-panels"></div></div>
        </div>
    </section>
    <section id="gm-appearance" class="gm-overlay" hidden>
        <div class="gm-appearance-window" role="dialog" aria-modal="true" aria-labelledby="gm-appearance-title">
            <div class="gm-settings-heading"><h2 id="gm-appearance-title">Appearance</h2><button type="button" id="gm-appearance-close" class="gm-icon" aria-label="Close appearance">×</button></div>
            <label>Palette<select id="gm-palette"><option value="google">Google dark</option><option value="st">Follow SillyTavern</option></select></label>
            <label class="gm-checkbox"><input type="checkbox" id="gm-background">Show SillyTavern background</label>
            <p>Visual Novel mode follows SillyTavern’s setting. Sprite and dialogue controls remain available in Extensions.</p>
        </div>
    </section>
</div>
