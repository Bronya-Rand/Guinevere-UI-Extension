<div class="guinevere-ui-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="Guinevere (UI Theme Extension)">Guinevere (UI Theme Extension)</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>

        <div class="inline-drawer-content">
            <div class="guinevere-drawer-content">
                <small class="flex-container justifyCenter">
                    <span data-i18n="Brought to you by">Brought to you by </span>
                    <a href="https://github.com/Bronya-Rand" data-i18n="Bronya Rand" target="_blank"
                        rel="noopener noreferrer">Bronya Rand</a>
                    <span data-i18n="and Guinaifen."> and Guinaifen.</span>
                </small>

                <div class="guinevere_block flex-container flexFlowColumn">
                    <label class="checkbox_label" for="guinevere-enable" title="Toggles Guinevere features."
                        data-i18n="[title]Toggles Guinevere features.">
                        <input id="guinevere-enable" type="checkbox" />
                        <span data-i18n="Enable Guinevere">Enable Guinevere</span>
                    </label>
                </div>

                <div class="guinevere_block flex-container flexFlowColumn">
                    <label data-i18n="Theme" for="guinevere-theme-select">Theme</label>
                    <div class="flex-container flexFlowRow">
                        <select id="guinevere-theme-select" class="text_pole" aria-label="Guinevere theme">
                            <option value="">Loading themes...</option>
                        </select>
                        <button type="button" id="guinevere-refresh-themes" class="menu_button" data-i18n="Refresh Themes">Refresh Themes</button>
                    </div>
                    <div class="flex-container flexFlowRow">
                        <button type="button" id="guinevere-import-theme" class="menu_button" disabled data-i18n="Import Theme ZIP">Import Theme ZIP</button>
                        <input type="file" id="guinevere-theme-upload" accept=".zip,application/zip,application/x-zip-compressed" hidden />
                    </div>
                    <small id="guinevere-import-status" role="status" aria-live="polite"></small>
                    <small>Theme packs can run JavaScript. Import packs from authors you trust.</small>
                    <small><a href="https://github.com/Bronya-Rand/Guinevere-UI-Extension#theme-zip-import" target="_blank" rel="noopener noreferrer">Theme import setup and pack format</a></small>
                </div>

                <div class="guinevere_block flex-container flexFlowRow alignitemscenter justifyCenter">
                    <small id="guinevere-apply" class="menu_button menu_button_icon" data-i18n="Apply Theme">Apply
                        Theme</small>
                    <small id="guinevere-reset" class="menu_button menu_button_icon" data-i18n="Reset to Defaults">Reset
                        to Defaults</small>
                </div>

                <div class="guinevere_block flex-container flexFlowColumn" style="gap: 1px; padding-bottom: 5px;">
                    <small class="flex-container justifyCenter alignitemscenter">
                        <span>Guinevere UI Extension Version
                            <a id="guinevere-version-number"
                                href="https://github.com/Bronya-Rand/Guinevere-UI-Extension" target="_blank"
                                rel="noopener noreferrer">2.0.0 (Beta 4)</a></span>
                    </small>
                </div>
            </div>
        </div>
    </div>
